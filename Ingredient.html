<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delish - Share</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/Ingredient.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header">
          <div class="header-logo">
            <img src="Logo.jpg" alt="" />
          </div>
          <div class="header-right">
            <nav>
              <ul>
                <li>
                  <a href="index.html">Trang chủ</a>
                  <a href="Dish.html">Món ăn</a>
                  <a href="Ingredient.html">Nguyên liệu</a>
                  <a href="FoodMenu.html">Thực đơn</a>
                  <a href="Profile.html">Cá nhân</a>
                  <a href="Login.html">Đăng nhập / Đăng ký</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </header>
      <main>
        <div class="save">
          <i class="fa-solid fa-bookmark"></i>
          <a href="">Món ăn đã lưu</a>
        </div>
        <div class="search-bar">
          <div class="search-input">
            <input
              type="text"
              name=""
              id=""
              placeholder="Nhập nguyên liệu cần tìm"
            />
            <i class="fa-solid fa-magnifying-glass input-right"></i>
          </div>
        </div>
        <div class="label">
          <h2>Nguyên liệu</h2>
          <h4>Hãy chọn nguyên liệu bạn muốn</h4>
        </div>
        <div class="list-ingredient1">
          <div class="ingredient-item">
            <img src="Ingredient/thitga.jpg" alt="" />
            <p>Thịt Gà</p>
            <input type="checkbox" name="ThitGa" id="thitgaCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/trứng.jpg" alt="" />
            <p>Trứng</p>
            <input type="checkbox" name="Trung" id="trungCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/thitbo.jpg" alt="" />
            <p>Thịt Bò</p>
            <input type="checkbox" name="ThitBo" id="thitboCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/thitheo.jpg" alt="" />
            <p>Thịt heo</p>
            <input type="checkbox" name="ThitHeo" id="thitheoCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/chả.jpg" alt="Chả" />
            <p>Chả</p>
            <input type="checkbox" name="cha" id="chaCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/mực.jpg" alt="" />
            <p>Mực</p>
            <input type="checkbox" name="Muc" id="mucCheck" />
          </div>
        </div>
        <div class="list-ingredient2">
          <div class="ingredient-item">
            <img src="Ingredient/cá.jpg" alt="" />
            <p>Cá</p>
            <input type="checkbox" name="Ca" id="caCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/tôm.jpg" alt="" />
            <p>Tôm</p>
            <input type="checkbox" name="Tom" id="tomCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/bánh mì.jpg" alt="" />
            <p>Bánh mì</p>
            <input type="checkbox" name="BanhMi" id="banhmiCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/ốc.jpg" alt="" />
            <p>Ốc</p>
            <input type="checkbox" name="oc" id="ocCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/đậu phụ.jpg" alt="" />
            <p>Đậu phụ</p>
            <input type="checkbox" name="Dauphu" id="dauphuCheck" />
          </div>
          <div class="ingredient-item">
            <img src="Ingredient/sữa.jpg" alt="" />
            <p>Sữa</p>
            <input type="checkbox" name="Sua" id="suaCheck" />
          </div>
        </div>
      </main>
      <footer>
        <div class="footer-left">
          <h2>Contacts Us</h2>
        </div>
        <div class="footer-right">
          <ul>
            <li>
              <a href="">Hotline: 19001502</a>
              <a href="">Email: delishshare@gmail.com</a>
            </li>
          </ul>
        </div>
      </footer>
    </div>
  </body>
</html>
