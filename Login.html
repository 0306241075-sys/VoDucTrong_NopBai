<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delish - Share</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/Login.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header">
          <div class="header-logo">
            <img src="Logo.jpg" alt="" />
          </div>
          <div class="header-right">
            <nav>
              <ul>
                <li>
                  <a href="index.html">Trang chủ</a>
                  <a href="Dish.html">Món ăn</a>
                  <a href="Ingredient.html">Nguyên liệu</a>
                  <a href="FoodMenu.html">Thực đơn</a>
                  <a href="Profile.html">Cá nhân</a>
                  <a href="Login.html">Đăng nhập / Đăng ký</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </header>
      <main>
        <div class="container-login">
          <div class="login-left">
            <h2 class="welcome">
              <span class="">Discover & Share</span>
              <span class="">Delicious Recipes</span>
            </h2>
            <img src="Login/daubep.png" alt="" />
          </div>
          <div class="table-login">
            <main class="login-container">
              <h2>Đăng nhập</h2>
              <div class="input-group">
                <span class="input-icon">&#128100;</span>
                <input type="text" placeholder="Tên đăng nhập" />
              </div>
              <div class="input-group">
                <span class="input-icon lock">&#128274;</span>
                <input type="password" placeholder="Mật khẩu" />
              </div>
              <a href="Admin.html">
                <button class="btn-login">Đăng nhập</button>
              </a>
              <a href="#" class="forgot-password">Quên mật khẩu</a>
              <button class="btn-create">Tạo tài khoản mới</button>
              <div class="or-text">Hoặc</div>
              <button class="btn-google">
                <img src="Login/Google logo with ful.png" alt="Google logo" />
                Tiếp tục với Google
              </button>
              <button class="btn-apple">
                <img src="Login/Apple_logo_black.svg" alt="Apple logo" />
                Tiếp tục với Apple
              </button>
            </main>
          </div>
        </div>
      </main>
      <footer>
        <div class="footer-left">
          <h2>Contacts Us</h2>
        </div>
        <div class="footer-right">
          <ul>
            <li>
              <a href="">Hotline: 19001502</a>
              <a href="">Email: delishshare@gmail.com</a>
            </li>
          </ul>
        </div>
      </footer>
    </div>
  </body>
</html>
